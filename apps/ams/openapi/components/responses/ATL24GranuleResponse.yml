description: Successful granule detail response
content:
  application/json:
    schema:
      type: object
      description: >
        A map of beam name to beam metadata for the requested granule.
      additionalProperties:
        type: object
        properties:
          season:
            type: integer
          bathy_photons:
            type: integer
          bathy_mean_depth:
            type: number
            nullable: true
            description: Null when the beam has no bathymetry photons.
          bathy_min_depth:
            type: number
            nullable: true
            description: Null when the beam has no bathymetry photons.
          bathy_max_depth:
            type: number
            nullable: true
            description: Null when the beam has no bathymetry photons.
          begin_time:
            type: string
            format: date-time
