AWSTemplateFormatVersion: '2010-09-09'
Description: SlideRule Provisioner Lambda

Parameters:

  ##
  ## Parameters
  ##

  EnvironmentVersion:
    Type: String
  Domain:
    Type: String
  PublicCluster:
    Type: String
  ProvisionerHostname:
    Type: String
  JwtIssuer:
    Type: String
  ProjectBucket:
    Type: String
  ProjectPublicBucket:
    Type: String
  ContainerRegistry:
    Type: String
  CorsAllowOrigins:
    Type: CommaDelimitedList
  HostedZoneId:
    Type: String
  CertificateArn:
    Type: String
  AlertStream:
    Type: String
  TelemetryStream:
    Type: String
  SupportEmail:
    Type: String
  AlertEmail:
    Type: String
  LambdaZipFile:
    Type: String

Resources:

  ############################
  # Lambda Functions
  ############################

  # Schedule Lambda Function
  ScheduleLambda:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub '${AWS::StackName}-schedule'
      Runtime: python3.13
      Handler: scheduler.lambda_schedule
      Role: !GetAtt GatewayRole.Arn
      Architectures:
        - arm64
      Timeout: 60
      Code:
        S3Bucket: !Ref ProjectBucket
        S3Key: !Ref LambdaZipFile

  # Destroy Lambda Function
  DestroyLambda:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub '${AWS::StackName}-destroy'
      Role: !GetAtt GatewayRole.Arn
      Architectures:
        - arm64
      Runtime: python3.13
      MemorySize: 256 # MB
      Timeout: 300 # seconds
      Handler: provisioner.lambda_destroy
      Description: Destroy the cluster
      Code:
        S3Bucket: !Ref ProjectBucket
        S3Key: !Ref LambdaZipFile

  # Gateway Lambda Function
  GatewayLambda:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub '${AWS::StackName}-gateway'
      Role: !GetAtt GatewayRole.Arn
      Architectures:
        - arm64
      Runtime: python3.13
      MemorySize: 256 # MB
      Timeout: 300 # seconds
      Handler: provisioner.lambda_handler
      Description: Routes requests based on path
      Code:
        S3Bucket: !Ref ProjectBucket
        S3Key: !Ref LambdaZipFile
      Environment:
        Variables:
          STACK_NAME: !Ref AWS::StackName
          ENVIRONMENT_VERSION: !Ref EnvironmentVersion
          DOMAIN: !Ref Domain
          PUBLIC_CLUSTER: !Ref PublicCluster
          PROJECT_BUCKET: !Ref ProjectBucket
          PROJECT_PUBLIC_BUCKET: !Ref ProjectPublicBucket
          CONTAINER_REGISTRY: !Ref ContainerRegistry
          LAMBDA_ZIP_FILE: !Ref LambdaZipFile
          JWT_ISSUER: !Ref JwtIssuer
          ALERT_STREAM: !Ref AlertStream
          TELEMETRY_STREAM: !Ref TelemetryStream
          SUPPORT_EMAIL: !Ref SupportEmail
          ALERT_EMAIL: !Ref AlertEmail

  # S3 Access Lambda Function
  S3AccessLambda:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub '${AWS::StackName}-s3access'
      Role: !GetAtt S3AccessRole.Arn
      Architectures:
        - arm64
      Runtime: python3.13
      MemorySize: 256 # MB
      Timeout: 300 # seconds
      Handler: provisioner.lambda_handler
      Description: Provides temporary credentials to access public bucket
      Code:
        S3Bucket: !Ref ProjectBucket
        S3Key: !Ref LambdaZipFile
      Environment:
        Variables:
          STACK_NAME: !Ref AWS::StackName
          DOMAIN: !Ref Domain
          PUBLIC_CLUSTER: !Ref PublicCluster
          PROJECT_PUBLIC_BUCKET: !Ref ProjectPublicBucket
          FEDERATED_S3_ACCESS_ARN: !GetAtt FederatedS3AccessRole.Arn

  ############################
  # IAM Roles
  ############################

  ## Gateway Lambda IAM Role
  GatewayRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
        - arn:aws:iam::aws:policy/PowerUserAccess
      Policies:
        - PolicyName: !Sub "${AWS::StackName}-allow-cf-stack-management"
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - iam:CreateRole
                  - iam:GetRole
                  - iam:DeleteRole
                  - iam:AttachRolePolicy
                  - iam:DetachRolePolicy
                  - iam:PutRolePolicy
                  - iam:DeleteRolePolicy
                  - iam:TagRole
                  - iam:PassRole
                Resource: "arn:aws:iam::*:role/*"
              - Effect: Allow
                Action:
                  - iam:CreateInstanceProfile
                  - iam:GetInstanceProfile
                  - iam:DeleteInstanceProfile
                  - iam:AddRoleToInstanceProfile
                  - iam:RemoveRoleFromInstanceProfile
                  - iam:TagInstanceProfile
                Resource: "arn:aws:iam::*:instance-profile/*"
              - Effect: Allow
                Action:
                  - lambda:CreateFunction
                  - lambda:GetFunction
                  - lambda:DeleteFunction
                  - lambda:AddPermission
                  - lambda:RemovePermission
                  - lambda:UpdateFunctionCode
                  - lambda:UpdateFunctionConfiguration
                Resource: "arn:aws:lambda:*:*:function:*"
              - Effect: Allow
                Action:
                  - cloudformation:CreateStack
                  - cloudformation:DescribeStacks
                  - cloudformation:DeleteStack
                  - cloudformation:DescribeStackResources
                  - cloudformation:UpdateStack
                Resource: "*"
        - PolicyName: !Sub "${AWS::StackName}-scheduler-policy"
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - events:PutRule
                  - events:PutTargets
                  - events:DescribeRule
                Resource: '*'
              - Effect: Allow
                Action:
                  - lambda:AddPermission
                Resource: '*'
        - PolicyName: !Sub "${AWS::StackName}-ses-restricted-send-policy"
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - ses:SendEmail
                  - ses:SendRawEmail
                Resource:
                  - !Sub arn:aws:ses:${AWS::Region}:${AWS::AccountId}:identity/${Domain}
                  - !Sub arn:aws:ses:${AWS::Region}:${AWS::AccountId}:identity/${SupportEmail}
                Condition:
                  ForAllValues:StringEquals:
                    ses:Recipients:
                      - !Sub ${AlertEmail}
        - PolicyName: !Sub "${AWS::StackName}-secret-access"
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - secretsmanager:GetSecretValue
                Resource: !Sub arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:${Domain}/*

  ## S3 Access Lambda IAM Role
  S3AccessRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${AWS::StackName}-s3-credential-vendor"
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: assume-federated-s3-role
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: sts:AssumeRole
                Resource: !Sub "arn:aws:iam::${AWS::AccountId}:role/${AWS::StackName}-federated-s3-access"

  ## S3 Access Assumed IAM Role
  FederatedS3AccessRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${AWS::StackName}-federated-s3-access"
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              AWS: !GetAtt S3AccessRole.Arn
            Action: sts:AssumeRole
      Policies:
        - PolicyName: s3-read-access
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: s3:ListBucket
                Resource: !Sub "arn:aws:s3:::${ProjectPublicBucket}"
              - Effect: Allow
                Action: s3:GetObject
                Resource: !Sub "arn:aws:s3:::${ProjectPublicBucket}/*"

  ############################
  # HTTP API
  ############################

  # API Gateway HTTP API
  HttpApi:
    Type: AWS::ApiGatewayV2::Api
    Properties:
      Name: !Sub '${AWS::StackName}-gateway'
      Description: Provisioner API for SlideRule
      ProtocolType: HTTP
      CorsConfiguration:
        AllowOrigins: !Ref CorsAllowOrigins
        AllowMethods:
          - GET
          - POST
          - OPTIONS
        AllowHeaders:
          - Content-Type
          - Authorization
        MaxAge: 300

  # JWT Authorizer (Native API Gateway)
  JwtAuthorizer:
    Type: AWS::ApiGatewayV2::Authorizer
    Properties:
      Name: !Sub '${AWS::StackName}-jwt-authorizer'
      ApiId: !Ref HttpApi
      AuthorizerType: JWT
      IdentitySource:
        - $request.header.Authorization
      JwtConfiguration:
        Audience:
          - provisioner
        Issuer: !Ref JwtIssuer

  # API Gateway Stage
  ApiStage:
    Type: AWS::ApiGatewayV2::Stage
    Properties:
      ApiId: !Ref HttpApi
      StageName: '$default'
      AutoDeploy: true
      DefaultRouteSettings:
        ThrottlingBurstLimit: 10
        ThrottlingRateLimit: 5

  # API Gateway Custom Domain Name
  ApiCustomDomain:
    Type: AWS::ApiGatewayV2::DomainName
    Properties:
      DomainName: !Ref ProvisionerHostname
      DomainNameConfigurations:
        - EndpointType: REGIONAL
          CertificateArn: !Ref CertificateArn

  ## API Mapping (connects custom domain to API)
  ApiMapping:
    Type: AWS::ApiGatewayV2::ApiMapping
    DependsOn: ApiCustomDomain
    Properties:
      DomainName: !Ref ApiCustomDomain
      ApiId: !Ref HttpApi
      Stage: !Ref ApiStage

  # Route53 Alias Record
  ApiDnsRecord:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneName: !Sub "${Domain}."
      Name: !Ref ProvisionerHostname
      Type: A
      AliasTarget:
        DNSName: !GetAtt ApiCustomDomain.RegionalDomainName
        HostedZoneId: !GetAtt ApiCustomDomain.RegionalHostedZoneId
        EvaluateTargetHealth: false

  ############################
  # Lambda Integrations
  ############################

  # Gateway Integration with Lambda
  GatewayIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref HttpApi
      IntegrationType: AWS_PROXY
      IntegrationUri: !GetAtt GatewayLambda.Arn
      PayloadFormatVersion: '2.0'

  # Gateway API Routes
  GatewayApiRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref HttpApi
      RouteKey: 'POST /{proxy+}'
      AuthorizationType: JWT
      AuthorizerId: !Ref JwtAuthorizer
      Target: !Sub 'integrations/${GatewayIntegration}'

  # Gateway API Lambda Permission
  GatewayApiPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref GatewayLambda
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub 'arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${HttpApi}/*/*'

  # S3 Access Integration with Lambda
  S3AccessIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref HttpApi
      IntegrationType: AWS_PROXY
      IntegrationUri: !GetAtt S3AccessLambda.Arn
      PayloadFormatVersion: '2.0'

  # S3 Access API Routes
  S3AccessApiRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref HttpApi
      RouteKey: 'GET /s3access'
      AuthorizationType: JWT
      AuthorizerId: !Ref JwtAuthorizer
      Target: !Sub 'integrations/${S3AccessIntegration}'

  # S3 Access API Lambda Permission
  S3AccessApiPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref S3AccessLambda
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub 'arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${HttpApi}/*/GET/s3access'

Outputs:

  DestroyLambdaArn:
    Description: Lambda that deletes a cluster; available for auto-shutdown
    Value: !GetAtt DestroyLambda.Arn
    Export:
      Name: !Sub ${AWS::StackName}-destroy-arn

  ScheduleLambdaArn:
    Description: Lambda that schedules the auto-shutdown of a cluster
    Value: !GetAtt ScheduleLambda.Arn
    Export:
      Name: !Sub ${AWS::StackName}-scheduler-arn
