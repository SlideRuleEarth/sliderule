AWSTemplateFormatVersion: '2010-09-09'
Description: SlideRule User AutoScalingGroup

Parameters:

  Cluster:
    Type: String
  Username:
    Type: String
  NodeCapacity:
    Type: Number
  SpotCapacity:
    Type: Number
  TTL:
    Type: Number
  ClusterSubnet:
    Type: String
  SpotSubnets: # cluster subnet plus the cluster's spot subnets in the other availability zones
    Type: CommaDelimitedList
  ClusterNodeSG:
    Type: String
  InstanceProfile:
    Type: String
  DestroyLambdaArn:
    Type: String
  ScheduleLambdaArn:
    Type: String
  NodeUserData:
    Type: String

Conditions:

  HasAutoShutdown: !And
    - !Not [!Equals [!Ref ScheduleLambdaArn, ""]]
    - !Not [!Equals [!Ref DestroyLambdaArn, ""]]

  HasSpotCapacity: !Not [!Equals [!Ref SpotCapacity, "0"]]

Resources:

  UserLaunchTemplate:
    Type: AWS::EC2::LaunchTemplate
    Properties:
      LaunchTemplateName: !Sub "${Cluster}-lt-${Username}"
      LaunchTemplateData:
        ImageId: !Sub '{{resolve:ssm:/aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-arm64}}'
        InstanceType: m9g.2xlarge
        IamInstanceProfile:
          Name: !Ref InstanceProfile
        NetworkInterfaces:
          - DeviceIndex: 0
            Groups:
              - !Ref ClusterNodeSG
        BlockDeviceMappings:
          - DeviceName: "/dev/xvda"
            Ebs:
              VolumeSize: 40
              VolumeType: gp3
              DeleteOnTermination: true
        UserData: !Ref NodeUserData

  UserAutoScalingGroup:
    Type: AWS::AutoScaling::AutoScalingGroup
    Properties:
      AutoScalingGroupName: !Sub "${Cluster}-asg-${Username}"
      MinSize: !Ref NodeCapacity
      MaxSize: !Ref NodeCapacity
      DesiredCapacity: !Ref NodeCapacity
      VPCZoneIdentifier:
        - !Ref ClusterSubnet
      HealthCheckType: EC2
      LaunchTemplate:
        LaunchTemplateId: !Ref UserLaunchTemplate
        Version: !GetAtt UserLaunchTemplate.LatestVersionNumber
      Tags:
        - Key: Name
          Value: !Sub "${Cluster}-node-${Username}"
          PropagateAtLaunch: true

  UserSpotAutoScalingGroup:
    Type: AWS::AutoScaling::AutoScalingGroup
    Condition: HasSpotCapacity
    Properties:
      AutoScalingGroupName: !Sub "${Cluster}-spot-asg-${Username}"
      # best-effort spot nodes spread across all availability zones; MinSize is 0
      # so stack creation doesn't fail when no spot capacity is available; there
      # is no SpotMaxPrice (capped at the on-demand price) and no capacity
      # rebalancing, so nodes are only replaced when actually interrupted
      MinSize: 0
      MaxSize: !Ref SpotCapacity
      DesiredCapacity: !Ref SpotCapacity
      VPCZoneIdentifier: !Ref SpotSubnets
      HealthCheckType: EC2
      CapacityRebalance: false
      MixedInstancesPolicy:
        InstancesDistribution:
          OnDemandBaseCapacity: 0
          OnDemandPercentageAboveBaseCapacity: 0
          SpotAllocationStrategy: price-capacity-optimized
        LaunchTemplate:
          LaunchTemplateSpecification:
            LaunchTemplateId: !Ref UserLaunchTemplate
            Version: !GetAtt UserLaunchTemplate.LatestVersionNumber
          Overrides:
            - InstanceType: m9g.2xlarge
            - InstanceType: m8g.2xlarge
            - InstanceType: r9g.xlarge
            - InstanceType: r8g.xlarge
      Tags:
        - Key: Name
          Value: !Sub "${Cluster}-node-${Username}"
          PropagateAtLaunch: true

  AutoShutdownCustomResource:
    Type: Custom::ScheduleStackDeletion
    Condition: HasAutoShutdown
    DependsOn:
      - UserAutoScalingGroup
    Properties:
      ServiceToken: !Ref ScheduleLambdaArn
      StackName: !Ref AWS::StackName
      DeleteAfterMinutes: !Ref TTL
      DeletionLambdaArn: !Ref DestroyLambdaArn
