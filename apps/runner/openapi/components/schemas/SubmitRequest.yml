type: object
required:
  - name
  - script
  - args
properties:
  name:
    type: string
    description: Human-readable name for the job.
    example: my-processing-job
  script:
    type: string
    format: byte
    description: Base64-encoded Lua script to execute.
  args:
    type: array
    items:
      type: string
    description: List of argument strings; each element becomes a separate batch job.
    example: ["granule1.h5", "granule2.h5"]
  vcpus:
    type: integer
    minimum: 1
    maximum: 8
    description: Optional vCPU override per job container.
  memory:
    type: integer
    minimum: 4096
    maximum: 32768
    description: Optional memory (MB) override per job container.
  image:
    type: string
    default: sliderule:latest
    description: Optional container image override for the job.
    example: sliderule:latest
  queue:
    type: string
    enum:
      - urgent
      - default
      - background
    default: default
    description: Optional job queue to submit to; higher priority queues are dispatched first.
    example: default
