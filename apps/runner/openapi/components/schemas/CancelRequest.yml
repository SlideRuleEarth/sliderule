type: object
properties:
  job_list:
    type: array
    items:
      type: string
    description: >
      List of job IDs to cancel. If omitted, all active jobs
      (SUBMITTED, PENDING, RUNNABLE, STARTING, RUNNING) will be canceled.
  queue:
    type: string
    enum:
      - urgent
      - default
      - background
    default: default
    description: Job queue to cancel jobs from. Only used if job_list is not supplied.
    example: default
