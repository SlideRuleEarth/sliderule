type: object
properties:
  job_list:
    type: array
    items:
      type: string
    description: >
      List of job IDs to cancel. If omitted, all active jobs
      (SUBMITTED, PENDING, RUNNABLE, STARTING, RUNNING) will be canceled.
  name:
    type: string
    description: >
      The name associated with the jobs that should be cancelled.
      Only used if job_list is not supplied.
    example: my-processing-job
  queue:
    type: string
    enum:
      - urgent
      - default
      - background
    default: default
    description: Optional job queue to submit to; higher priority queues are dispatched first.
    example: default
