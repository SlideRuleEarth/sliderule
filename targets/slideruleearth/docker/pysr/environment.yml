# conda env create -f environment.yml
name: pysr
channels:
  - conda-forge
dependencies:
  - boto3
  - python-duckdb<2 # geography community extension (S2 cells) is not yet published for duckdb 2.x
  - geopandas
  - h5py
  - pyarrow=24
  - rasterio
  - s3fs>=2024 # older s3fs (0.4.x) is sync and does not retry SlowDown; without this the solver falls back to it when boto3 outpaces aiobotocore
  - setuptools-scm
  - shapely
  - pip