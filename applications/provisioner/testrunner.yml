AWSTemplateFormatVersion: '2010-09-09'
Description: SlideRule Test Runner Instance

Parameters:

  #
  # Variables
  #
  ProjectBucket:
    Type: String
  ProjectPublicBucket:
    Type: String
  DestroyLambdaArn:
    Type: String
  ScheduleLambdaArn:
    Type: String
  DeployDate:
    Type: String
  TestRunnerUserData:
    Type: String

  #
  # Constants
  #
  AvailabilityZone:
    Type: String
    Default: "us-west-2d"
  DeleteAfterMinutes:
    Type: Number
    Default: 80

Resources:

  #
  # Network
  #
  RemoteVPC:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: "10.0.0.0/16"
      EnableDnsSupport: true
      EnableDnsHostnames: true
  RemoteSubnet:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref RemoteVPC
      CidrBlock: 10.0.1.0/24
      MapPublicIpOnLaunch: true
      AvailabilityZone: !Ref AvailabilityZone
  RemoteIGW:
    Type: AWS::EC2::InternetGateway
  AttachIGW:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      InternetGatewayId: !Ref RemoteIGW
      VpcId: !Ref RemoteVPC
  RemoteRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref RemoteVPC
  RemoteRoute:
    Type: AWS::EC2::Route
    DependsOn: AttachIGW
    Properties:
      RouteTableId: !Ref RemoteRouteTable
      DestinationCidrBlock: "0.0.0.0/0"
      GatewayId: !Ref RemoteIGW
  RouteAssoc:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref RemoteSubnet
      RouteTableId: !Ref RemoteRouteTable
  S3VPCEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Properties:
      VpcId: !Ref RemoteVPC
      ServiceName: !Sub "com.amazonaws.${AWS::Region}.s3"
      VpcEndpointType: Gateway
      RouteTableIds:
        - !Ref RemoteRouteTable
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: "*"
            Action: "*"
            Resource: "*"
  #
  # IAM Role
  #
  RemoteRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - ec2.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonEC2ContainerRegistryReadOnly
        - arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore
        - arn:aws:iam::aws:policy/CloudWatchAgentServerPolicy
        - arn:aws:iam::aws:policy/CloudWatchAgentAdminPolicy
      Policies:
        - PolicyName: !Sub "${AWS::StackName}-s3-access"
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: ["s3:ListBucket"]
                Resource:
                  - !Sub "arn:aws:s3:::${ProjectBucket}"
                  - !Sub "arn:aws:s3:::${ProjectPublicBucket}"
                  - arn:aws:s3:::pgc-opendata-dems
                  - arn:aws:s3:::prd-tnm
                  - arn:aws:s3:::esa-worldcover
                  - arn:aws:s3:::noaa-ocs-nationalbathymetry-pds
                  - arn:aws:s3:::dataforgood-fb-data
                  - arn:aws:s3:::casals-data
              - Effect: Allow
                Action: ["s3:GetObject"]
                Resource:
                  - !Sub "arn:aws:s3:::${ProjectBucket}/*"
                  - !Sub "arn:aws:s3:::${ProjectPublicBucket}/*"
                  - arn:aws:s3:::pgc-opendata-dems/*
                  - arn:aws:s3:::prd-tnm/*
                  - arn:aws:s3:::esa-worldcover/*
                  - arn:aws:s3:::noaa-ocs-nationalbathymetry-pds/*
                  - arn:aws:s3:::dataforgood-fb-data/*
                  - arn:aws:s3:::casals-data/*
              - Effect: Allow
                Action: ["s3:PutObject"]
                Resource:
                  - !Sub "arn:aws:s3:::${ProjectBucket}/testrunner/*"
                  - !Sub "arn:aws:s3:::${ProjectPublicBucket}/*"
        - PolicyName: !Sub "${AWS::StackName}-ec2-access"
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - ec2:DescribeInstances
                  - ec2:TerminateInstances
                Resource: "*"
        - PolicyName: !Sub "${AWS::StackName}-secret-access"
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - secretsmanager:GetSecretValue
                Resource: !Sub arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:localhost/*
  InstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      Roles: [!Ref RemoteRole]

  #
  # Security Group
  #
  RemoteSG:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Test Runner Security Group
      VpcId: !Ref RemoteVPC
      SecurityGroupEgress:
        # ALL
        - IpProtocol: -1
          FromPort: 0
          ToPort: 0
          CidrIp: "0.0.0.0/0"
      Tags:
        - Key: Name
          Value: "testrunner-sg"

  #
  # EC2 Instance
  #
  TestRunnerInstance:
    Type: AWS::EC2::Instance
    Properties:
      ImageId: !Sub '{{resolve:ssm:/aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-arm64}}'
      InstanceType: t4g.2xlarge
      AvailabilityZone: !Ref AvailabilityZone
      IamInstanceProfile: !Ref InstanceProfile
      SourceDestCheck: true
      Monitoring: false
      NetworkInterfaces:
        - DeviceIndex: 0
          AssociatePublicIpAddress: true
          SubnetId: !Ref RemoteSubnet
          GroupSet:
            - !Ref RemoteSG
      BlockDeviceMappings:
        - DeviceName: /dev/xvda
          Ebs:
            VolumeSize: 40
            VolumeType: gp3
            DeleteOnTermination: true
      Tags:
        - Key: Name
          Value: !Sub "${AWS::StackName}-${DeployDate}"
      UserData:
        Fn::Base64: !Ref TestRunnerUserData

  #
  # Custom Schedule Trigger
  #
  AutoDeleteScheduler:
    Type: Custom::ScheduleStackDeletion
    DependsOn:
      - TestRunnerInstance
    Properties:
      ServiceToken: !Ref ScheduleLambdaArn
      StackName: !Ref AWS::StackName
      DeleteAfterMinutes: !Ref DeleteAfterMinutes
      DeletionLambdaArn: !Ref DestroyLambdaArn
