[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sliderule-cli"
version = "0.1.0"
description = "SlideRule command line tool"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["sliderule", "boto3"]

[project.optional-dependencies]
progress = ["tqdm"]

[project.scripts]
sliderule-runner = "sliderule_runner.main:main"

[tool.setuptools.packages.find]
where = ["src"]