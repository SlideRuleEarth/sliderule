# conda env create -f environment.yml
name: myst
channels:
  - conda-forge
dependencies:
  - python=3.12
  - shapely
  - numpy
  - jupyterlab
  - geopandas
  - matplotlib
  # conda-forge's node 26 reports itself as "26.x.y-alpha.0.0.0", which mystmd's semver check rejects
  - nodejs=24
  # myst.yml uses the unpinned book-theme, which always resolves to the latest theme release and requires a recent mystmd
  - mystmd>=1.13
  - pip
