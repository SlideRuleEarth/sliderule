# conda env create -f environment.yml
name: myst
channels:
  - conda-forge
dependencies:
  - python=3.12
  - shapely
  - numpy
  - jupyterlab
  - geopandas
  - matplotlib
  # conda-forge's node 26 reports itself as "26.x.y-alpha.0.0.0", which mystmd's semver check rejects
  - nodejs=24
  - mystmd
  - pip
